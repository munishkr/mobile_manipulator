# Copy of clearpath_nav2_demos/config/a200/localization.yaml tuned for this sim
# (walls added, map generated from the world). Loaded by launch/localization_custom.launch.py.
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.3             # was 0.2: skid-steer turns slide the base ~5 cm/quarter turn
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 180          # was 60: use more of the 540-beam scan
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.1          # was 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1       # was 0.2: correct more often while turning
    update_min_d: 0.15      # was 0.25
    z_hit: 0.8              # was 0.5: the map now matches the world exactly
    z_max: 0.05
    z_rand: 0.1             # was 0.5: too much weight on "random" made scans weak
    z_short: 0.05
    scan_topic: sensors/lidar2d_0/scan

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True
